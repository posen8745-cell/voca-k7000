<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 GitHub 專案</title>

  <!-- 基本 SEO -->
  <meta name="description" content="GitHub Pages 專案首頁" />
  <meta name="author" content="Your Name" />

  <!-- 樣式 -->
  <style>
    :root {
      --main: #2563eb;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "Noto Sans TC", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--main);
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      background: var(--main);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: .9;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  📦 我的 GitHub Pages 專案
</header>

<main>

  <div class="card">
    <h2>📌 專案說明</h2>
    <p>
      這是一個放在 GitHub Pages 上的前端專案首頁。  
      你可以在這裡加入系統工具、查詢頁、資料轉換、表單等功能。
    </p>
  </div>

  <div class="card">
    <h2>🛠 功能區</h2>
    <button onclick="hello()">測試按鈕</button>
  </div>

</main>

<footer>
  © 2026 Your Name · Powered by GitHub Pages
</footer>

<script>
  function hello() {
    alert("GitHub Pages 運作正常 ✅");
  }
</script>

</body>
</html>
