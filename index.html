<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voca-k7000 單字測驗</title>

  <style>
    :root{
      --main:#2563eb;
      --bg:#f3f4f6;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --ok:#16a34a;
      --bad:#dc2626;
      --border:#e5e7eb;
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif; }
    body{ margin:0; background:var(--bg); color:var(--text); }
    header{
      background:var(--main);
      color:#fff;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    header .title{ font-size:18px; font-weight:800; }
    header .status{ font-size:14px; font-weight:650; opacity:.95; }

    main{ max-width:980px; margin:18px auto; padding:0 14px; }
    .card{
      background:var(--card);
      border-radius:14px;
      padding:16px;
      box-shadow:0 10px 20px rgba(0,0,0,.08);
      margin-bottom:14px;
    }

    .row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .pill{
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 12px;
      background:#fff;
      font-size:14px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    select{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#fff;
      font-size:14px;
    }

    button{
      border:none;
      background:var(--main);
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:750;
      cursor:pointer;
    }
    button.secondary{ background:#111827; }
    button.ghost{
      background:#fff;
      color:var(--text);
      border:1px solid var(--border);
      font-weight:700;
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .qhead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .qno{ font-size:14px; font-weight:800; color:var(--muted); }
    .qpos{ font-size:16px; font-weight:900; color:var(--main); }
    .qtext{
      margin:10px 0 0 0;
      font-size:26px;
      font-weight:900;
      letter-spacing:.2px;
    }

    .choices{ margin-top:14px; display:grid; grid-template-columns:1fr; gap:10px; }
    @media(min-width:720px){ .choices{ grid-template-columns:1fr 1fr; } }

    .choice{
      text-align:left;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      font-weight:750;
    }
    .choice:hover{ background:#f9fafb; }
    .msg{ margin-top:12px; font-weight:900; }
    .ok{ color:var(--ok); }
    .bad{ color:var(--bad); }

    .small{ font-size:13px; color:var(--muted); line-height:1.45; }
    .stats b{ font-size:16px; }
    ul{ margin:8px 0 0 0; padding-left:18px; }
    code{ background:#f9fafb; padding:2px 6px; border-radius:6px; border:1px solid var(--border); }

    footer{ text-align:center; color:var(--muted); padding:16px; font-size:13px; }
  </style>
</head>

<body>
<header>
  <div class="title">📚 voca-k7000 單字測驗</div>
  <div class="status" id="status">載入字庫中…</div>
</header>

<main>

  <div class="card">
    <div class="row">
      <span class="pill">
        題型：
        <select id="quizType">
          <option value="zh2en" selected>看中文選英文</option>
          <option value="en2zh">看英文選中文</option>
        </select>
      </span>

      <span class="pill">
        出題模式：
        <select id="mode">
          <option value="random" selected>隨機</option>
          <option value="order">順序</option>
        </select>
      </span>

      <span class="pill">
        選項數：
        <select id="optCount">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
        </select>
      </span>

      <span class="pill">
        顯示詞性(pos)
        <input id="showPos" type="checkbox" checked />
      </span>

      <button class="ghost" id="btnReset">重置本次</button>
      <button class="secondary" id="btnNext" disabled>下一題</button>
    </div>

    <div class="small" style="margin-top:10px">
      讀取檔案：<code>vocab_ceec_1_6.json</code>（放在 repo root）。若你更新 JSON 後看不到變化，請用無痕或強制重整（⌘+Shift+R）。
    </div>
  </div>

  <div class="card" id="quizCard">
    <div class="qhead">
      <div class="qno">第 <span id="qNo">-</span> 題</div>
      <div class="qpos" id="posBox" style="display:none"></div>
    </div>

    <div class="qtext" id="qText">（載入中）</div>

    <div class="choices" id="choices"></div>

    <div class="msg" id="msg"></div>
    <div class="small" id="answerHint" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div class="row stats">
      <span class="pill">作答：<b id="done">0</b></span>
      <span class="pill">答對：<b id="right">0</b></span>
      <span class="pill">答錯：<b id="wrong">0</b></span>
      <span class="pill">正確率：<b id="acc">0%</b></span>
    </div>

    <div style="margin-top:10px">
      <div class="small"><b>錯題清單（本次）</b></div>
      <ul id="wrongList"></ul>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="btnCopyWrong">複製錯題</button>
        <span class="small" id="copyMsg"></span>
      </div>
    </div>
  </div>

</main>

<footer>© 2026 · GitHub Pages</footer>

<script>
  // ====== 你 repo 的 JSON 檔名（root）======
  const JSON_PATH = "vocab_ceec_1_6.json";

  // ====== 狀態 ======
  let bank = [];            // {pos, zh, en}
  let orderIdx = 0;
  let current = null;       // 當前題目物件
  let currentAnswer = "";   // 正解文字（依題型）
  let locked = false;

  let stats = { done:0, right:0, wrong:0, wrongItems:[] };

  const $ = (id) => document.getElementById(id);

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 嚴格對齊你的 JSON：pos / zh / en
  function normalizeEntry(x){
    // 有些 JSON 可能用中文鍵名或大小寫，做個保險
    const pos = (x.pos ?? x.POS ?? x.part ?? x.partOfSpeech ?? "").toString().trim();
    const zh  = (x.zh  ?? x.ZH  ?? x.cn ?? x.ch ?? x.chinese ?? x.meaning ?? x.translation ?? "").toString().trim();
    const en  = (x.en  ?? x.EN  ?? x.word ?? x.english ?? x.vocab ?? "").toString().trim();
    if (!zh || !en) return null;
    return { pos, zh, en };
  }

  async function loadBank(){
    $("status").textContent = "載入字庫中…";
    try{
      // cache: no-store + 加上時間戳，避免 GitHub Pages 快取
      const res = await fetch(JSON_PATH + "?t=" + Date.now(), { cache:"no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();

      let arr = [];
      if (Array.isArray(data)) arr = data;
      else if (data && Array.isArray(data.items)) arr = data.items;
      else if (data && Array.isArray(data.data)) arr = data.data;
      else {
        for (const k in data){
          if (Array.isArray(data[k])) { arr = data[k]; break; }
        }
      }

      const parsed = [];
      for (const item of arr){
        const e = normalizeEntry(item);
        if (e) parsed.push(e);
      }

      if (parsed.length < 10){
        throw new Error("解析到的資料太少（" + parsed.length + "）。請確認 JSON 欄位包含 pos/zh/en。");
      }

      bank = parsed;
      $("status").textContent = "字庫載入完成：" + bank.length + " 筆 ✅";
      newQuestion();

    }catch(err){
      console.error(err);
      $("status").textContent = "讀不到字庫 ❌（" + err.message + "）";
      $("qText").textContent = "請確認 vocab_ceec_1_6.json 是否與 index.html 同層，且內容為 JSON。";
      $("choices").innerHTML = "";
    }
  }

  function getNextItem(){
    const mode = $("mode").value;
    if (mode === "order"){
      const item = bank[orderIdx % bank.length];
      orderIdx++;
      return item;
    }
    return bank[Math.floor(Math.random() * bank.length)];
  }

  function setQuestionUI(item){
    const showPos = $("showPos").checked;
    if (showPos && item.pos){
      $("posBox").style.display = "block";
      $("posBox").textContent = item.pos;
    }else{
      $("posBox").style.display = "none";
      $("posBox").textContent = "";
    }

    const type = $("quizType").value;
    if (type === "zh2en"){
      // 題幹只顯示中文（不顯示英文答案）
      $("qText").textContent = item.zh;
      currentAnswer = item.en;
    }else{
      // 題幹只顯示英文
      $("qText").textContent = item.en;
      currentAnswer = item.zh;
    }
  }

  function buildOptions(item){
    const type = $("quizType").value;
    const k = parseInt($("optCount").value, 10);

    // 正解文字
    const answerText = (type === "zh2en") ? item.en : item.zh;

    // 干擾池：排除同一筆（以 en+zh 組合判斷）
    const pool = bank.filter(x => !(x.en === item.en && x.zh === item.zh));
    shuffle(pool);

    // 取出 (k-1) 個干擾
    const distractors = pool.slice(0, Math.max(2, k-1)).map(x => (type === "zh2en") ? x.en : x.zh);

    const opts = shuffle([answerText, ...distractors]);
    return opts;
  }

  function newQuestion(){
    if (!bank.length) return;

    locked = false;
    $("msg").textContent = "";
    $("msg").className = "msg";
    $("answerHint").textContent = "";
    $("btnNext").disabled = true;

    current = getNextItem();
    $("qNo").textContent = stats.done + 1;

    setQuestionUI(current);

    const opts = buildOptions(current);
    const box = $("choices");
    box.innerHTML = "";

    opts.forEach(text => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.type = "button";
      btn.textContent = text;          // ✅ 這裡一定有字，不會再空白
      btn.addEventListener("click", () => choose(text));
      box.appendChild(btn);
    });
  }

  function lockChoices(){
    $("choices").querySelectorAll("button").forEach(b => b.disabled = true);
  }

  function updateStats(){
    $("done").textContent = stats.done;
    $("right").textContent = stats.right;
    $("wrong").textContent = stats.wrong;
    const acc = stats.done ? Math.round(stats.right * 100 / stats.done) : 0;
    $("acc").textContent = acc + "%";

    const ul = $("wrongList");
    ul.innerHTML = "";
    stats.wrongItems.slice(-30).forEach(it => {
      const li = document.createElement("li");
      li.textContent = it;
      ul.appendChild(li);
    });
  }

  function choose(pick){
    if (locked) return;
    locked = true;
    lockChoices();

    stats.done += 1;

    if (pick === currentAnswer){
      stats.right += 1;
      $("msg").textContent = "✅ 正確！";
      $("msg").className = "msg ok";
    }else{
      stats.wrong += 1;
      $("msg").textContent = "❌ 錯誤！";
      $("msg").className = "msg bad";
      $("answerHint").textContent = "正解是： " + currentAnswer;

      // 錯題格式（依題型）
      const type = $("quizType").value;
      if (type === "zh2en"){
        stats.wrongItems.push(`${current.pos ? current.pos + " " : ""}${current.zh} → ${current.en}（你選：${pick}）`);
      }else{
        stats.wrongItems.push(`${current.pos ? current.pos + " " : ""}${current.en} → ${current.zh}（你選：${pick}）`);
      }
    }

    updateStats();
    $("btnNext").disabled = false;
  }

  // ====== 控制 ======
  $("btnNext").addEventListener("click", newQuestion);

  $("btnReset").addEventListener("click", () => {
    stats = { done:0, right:0, wrong:0, wrongItems:[] };
    orderIdx = 0;
    $("copyMsg").textContent = "";
    updateStats();
    newQuestion();
  });

  $("mode").addEventListener("change", () => {
    orderIdx = 0;
    newQuestion();
  });

  $("optCount").addEventListener("change", newQuestion);

  $("quizType").addEventListener("change", newQuestion);

  $("showPos").addEventListener("change", () => setQuestionUI(current || {pos:"", zh:"", en:""}));

  $("btnCopyWrong").addEventListener("click", async () => {
    const text = stats.wrongItems.join("\n");
    if (!text){
      $("copyMsg").textContent = "目前沒有錯題可複製。";
      return;
    }
    try{
      await navigator.clipboard.writeText(text);
      $("copyMsg").textContent = "✅ 已複製到剪貼簿";
      setTimeout(() => $("copyMsg").textContent = "", 1500);
    }catch{
      $("copyMsg").textContent = "❌ 無法自動複製（瀏覽器權限限制），請手動複製錯題清單。";
    }
  });

  // ====== 啟動 ======
  loadBank();
</script>
</body>
</html>
